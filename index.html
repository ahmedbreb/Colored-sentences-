<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Colorized Text Renderer</title>
  <style>
    body {
      background-color: #0a0a0c;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 850px;
      width: 100%;
    }
    h1 { text-align: center; color: #ffffff; margin-bottom: 20px; }
    .card {
      background: #16161a;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: #aaa; }
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #000000;
      color: #00ffcc;
      font-family: monospace;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: bold;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #1d4ed8; }
    .preview-card {
      background-color: #000000;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 28px;
      font-size: 24px;
      line-height: 2.3;
      font-family: monospace, sans-serif;
      min-height: 120px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Chinese Colorized Text Renderer</h1>

  <!-- STEP 1: PROMPT BOX -->
  <div class="card">
    <label>1. Copy this Master Prompt (Click button below):</label>
    <textarea id="promptTemplate" readonly>Format this Chinese text into 3 color-coordinated lines (Hanzi, Pinyin, English).

Rules:
- Line 1: Hanzi (word-segmented with spaces)
- Line 2: Pinyin (word-segmented with tone marks)
- Line 3: English Translation
- Assign a unique vibrant color (#FFD700 yellow, #32CD32 green, #FFA500 orange, #FF69B4 pink, #1E90FF cyan, #9370DB purple) to each HSK 3+ word.
- Apply the EXACT SAME color to the Chinese word, its Pinyin, and its English translation using <span style="color:#HEX">word</span>. Low level words stay #E0E0E0.
- Return ONLY raw HTML inner elements inside a <div> tag without markdown backticks.

Text: [PASTE YOUR CHINESE SENTENCE HERE]</textarea>
    <button onclick="copyPromptText()">Copy Prompt</button>
  </div>

  <!-- STEP 2: CODE INPUT BOX -->
  <div class="card">
    <label>2. Paste the Code output from ChatGPT / DeepSeek here:</label>
    <textarea id="codeInput" placeholder="Paste the generated HTML code here..." oninput="renderCode()"></textarea>
  </div>

  <!-- STEP 3: LIVE RENDER OUTPUT -->
  <div class="card">
    <label>3. Rendered Result (Matches Photo):</label>
    <div id="previewCard" class="preview-card">
      <span style="color: #555; font-size: 16px;">Your colorized text will instantly render here as soon as you paste the code...</span>
    </div>
  </div>
</div>

<script>
  function copyPromptText() {
    const promptText = document.getElementById('promptTemplate');
    promptText.select();
    navigator.clipboard.writeText(promptText.value);
    alert('Prompt copied to clipboard! Paste it into ChatGPT/DeepSeek along with your Chinese text.');
  }

  function renderCode() {
    const rawCode = document.getElementById('codeInput').value;
    // Strip markdown code block wrappers if copied accidentally
    let cleanedCode = rawCode.replace(/```html/gi, '').replace(/```/g, '').trim();
    
    const previewDiv = document.getElementById('previewCard');
    if (cleanedCode) {
      previewDiv.innerHTML = cleanedCode;
    } else {
      previewDiv.innerHTML = '<span style="color: #555; font-size: 16px;">Your colorized text will instantly render here as soon as you paste the code...</span>';
    }
  }
</script>
</body>
</html>
