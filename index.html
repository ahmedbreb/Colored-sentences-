<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese HSK Word Colorizer</title>
  <style>
    body {
      background-color: #0f0f11;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 850px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 24px;
    }
    .card {
      background: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #222228;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    button {
      background-color: #3b82f6;
      color: #ffffff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .output-box {
      background-color: #000000;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 24px;
      font-size: 22px;
      line-height: 2.2;
      font-family: monospace, sans-serif;
      min-height: 120px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Chinese HSK Colorizer</h1>

  <div class="card">
    <label for="apiKey">API Key (OpenAI or DeepSeek):</label>
    <input type="password" id="apiKey" placeholder="sk-..." />

    <label for="apiEndpoint">Select API Provider:</label>
    <select id="apiEndpoint">
      <option value="https://api.openai.com/v1/chat/completions">OpenAI (gpt-4o-mini)</option>
      <option value="https://api.deepseek.com/chat/completions">DeepSeek (deepseek-chat)</option>
    </select>

    <label for="chineseInput">Chinese Text:</label>
    <textarea id="chineseInput" rows="3" placeholder="我快速翻过魔术课本，并没有发现无咏唱的记载。"></textarea>

    <button id="generateBtn">Colorize HSK 3+ Words</button>
  </div>

  <div class="card">
    <label>Result:</label>
    <div id="output" class="output-box">
      <span style="color: #666;">Rendered output will appear here...</span>
    </div>
  </div>
</div>

<script>
  const keyInput = document.getElementById('apiKey');
  keyInput.value = localStorage.getItem('hsk_app_key') || '';
  keyInput.addEventListener('change', () => localStorage.setItem('hsk_app_key', keyInput.value));

  document.getElementById('generateBtn').addEventListener('click', async () => {
    const text = document.getElementById('chineseInput').value.trim();
    const apiKey = keyInput.value.trim();
    const endpoint = document.getElementById('apiEndpoint').value;
    const outputDiv = document.getElementById('output');

    if (!text) return alert("Please enter Chinese text.");
    if (!apiKey) return alert("Please enter your API key.");

    outputDiv.innerHTML = '<span style="color: #888;">Colorizing text...</span>';

    const systemPrompt = `You are a Chinese language learning formatter. Process input text into 3 HTML lines:
Line 1: Hanzi (word-segmented with spaces)
Line 2: Pinyin (word-segmented with tone marks)
Line 3: English Translation

Identify vocabulary at HSK 3 level or above. Assign each matching word across all 3 lines the EXACT SAME unique vibrant hex color (e.g., #FFD700, #32CD32, #FFA500, #FF69B4, #1E90FF) using <span style="color: HEX;">...</span>. Keep lower-level grammar/words as #E0E0E0. Return ONLY valid HTML inner elements inside a <div> without markdown block backticks.`;

    const model = endpoint.includes('deepseek') ? 'deepseek-chat' : 'gpt-4o-mini';

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: model,
          messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: text }],
          temperature: 0.3
        })
      });

      const data = await res.json();
      let html = data.choices[0].message.content.replace(/```html/g, '').replace(/```/g, '').trim();
      outputDiv.innerHTML = html;
    } catch (err) {
      outputDiv.innerHTML = `<span style="color: #ff6b6b;">Error: ${err.message}</span>`;
    }
  });
</script>
</body>
</html>
