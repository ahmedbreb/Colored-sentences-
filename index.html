<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese HSK Colorizer (No API Key Required)</title>
  <!-- Free open-source library for Chinese word segmentation & Pinyin -->
  <script src="https://unpkg.com/pinyin-pro"></script>
  <style>
    body {
      background-color: #0f0f11;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 850px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 24px;
    }
    .card {
      background: #18181c;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
      color: #aaa;
    }
    textarea, input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #222228;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #10b981;
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #059669;
    }
    .output-box {
      background-color: #000000;
      border: 1px solid #2a2a30;
      border-radius: 12px;
      padding: 24px;
      font-size: 22px;
      line-height: 2.2;
      font-family: monospace, sans-serif;
      min-height: 120px;
      overflow-x: auto;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h1>Chinese HSK Colorizer</h1>

  <div class="card">
    <label for="chineseInput">Chinese Sentence:</label>
    <textarea id="chineseInput" rows="2" placeholder="我快速翻过魔术课本，并没有发现无咏唱的记载。">我快速翻过魔术课本，并没有发现无咏唱的记载。</textarea>

    <label for="englishInput">English Sentence (Optional):</label>
    <textarea id="englishInput" rows="2" placeholder="I quickly flipped through the magic textbook, but did not find any record of silent casting.">I quickly flipped through the magic textbook, but did not find any record of silent casting.</textarea>

    <button id="colorizeBtn">Colorize HSK 3+ Words</button>
  </div>

  <div class="card">
    <label>Result:</label>
    <div id="output" class="output-box">
      <span style="color: #666;">Colored output will appear here...</span>
    </div>
  </div>
</div>

<script>
  // Dictionary of high-level vocabulary (HSK 3+) mapped to English translation keywords
  const hskDictionary = {
    "翻过": { level: 3, translation: "flipped through", color: "#FFD700" }, // Yellow
    "课本": { level: 3, translation: "textbook", color: "#32CD32" },        // Green
    "并没有": { level: 3, translation: "but did not", color: "#FFA500" },     // Orange
    "无咏唱": { level: 5, translation: "silent casting", color: "#FF69B4" },  // Pink
    "记载": { level: 4, translation: "record", color: "#1E90FF" },          // Cyan/Blue
    "快速": { level: 3, translation: "quickly", color: "#9370DB" }          // Purple
  };

  const palette = ["#FFD700", "#32CD32", "#FFA500", "#FF69B4", "#1E90FF", "#9370DB", "#00FFFF"];

  document.getElementById('colorizeBtn').addEventListener('click', () => {
    const chineseText = document.getElementById('chineseInput').value.trim();
    let englishText = document.getElementById('englishInput').value.trim();
    const outputDiv = document.getElementById('output');

    if (!chineseText) return alert("Please enter Chinese text.");

    // Word segment Chinese text using Intl.Segmenter
    const segmenter = new Intl.Segmenter('zh-CN', { granularity: 'word' });
    const segments = Array.from(segmenter.segment(chineseText)).map(s => s.segment);

    let chineseLine = "";
    let pinyinLine = "";
    let colorIndex = 0;

    segments.forEach((word) => {
      // Get pinyin for the word
      const wordPinyin = pinyinPro.pinyin(word, { toneType: 'symbol' });

      // Check if word is in HSK 3+ dictionary
      if (hskDictionary[word]) {
        const item = hskDictionary[word];
        const color = item.color || palette[colorIndex % palette.length];
        colorIndex++;

        chineseLine += `<span style="color: ${color};">${word}</span> `;
        pinyinLine += `<span style="color: ${color};">${wordPinyin}</span> `;

        // Highlight matching word in English translation if present
        if (englishText && item.translation) {
          const regExp = new RegExp(`\\b${item.translation}\\b`, 'gi');
          englishText = englishText.replace(regExp, `<span style="color: ${color};">${item.translation}</span>`);
        }
      } else {
        chineseLine += `<span style="color: #E0E0E0;">${word}</span> `;
        pinyinLine += `<span style="color: #E0E0E0;">${wordPinyin}</span> `;
      }
    });

    let resultHTML = `<div>${chineseLine.trim()}</div>`;
    resultHTML += `<div>${pinyinLine.trim()}</div>`;
    if (englishText) {
      resultHTML += `<div>${englishText}</div>`;
    }

    outputDiv.innerHTML = resultHTML;
  });
</script>
</body>
</html>
