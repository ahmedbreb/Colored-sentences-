<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Colorized Text Renderer</title>
  <style>
    body {
      background-color: #0a0a0c;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }
    .app-container {
      max-width: 800px;
      width: 100%;
    }
    h2 {
      text-align: center;
      color: #ffffff;
      margin: 0 0 12px 0;
      font-size: 18px;
    }
    .card {
      background: #16161a;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13px;
      color: #aaa;
    }
    textarea {
      width: 100%;
      height: 50px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background-color: #000000;
      color: #00ffcc;
      font-family: monospace;
      font-size: 12px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: bold;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background-color: #1d4ed8; }
    
    /* COMPACT RESULT DISPLAY */
    .preview-card {
      background-color: #000000;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      padding: 16px;
      font-size: 17px;        /* Reduced font size */
      line-height: 1.6;        /* Tightened spacing */
      font-family: monospace, sans-serif;
      min-height: 90px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

<div class="app-container">
  <h2>Chinese HSK Colorizer</h2>

  <!-- STEP 1: PROMPT BOX -->
  <div class="card">
    <label>
      <span>1. Copy Master Prompt:</span>
      <button onclick="copyPromptText()">Copy Prompt</button>
    </label>
    <textarea id="promptTemplate" readonly>Format this Chinese text into 3 color-coordinated lines (Hanzi, Pinyin, English).

Rules:
- Line 1: Hanzi (word-segmented with spaces)
- Line 2: Pinyin (word-segmented with tone marks)
- Line 3: English Translation
- Assign a unique vibrant color (#FFD700 yellow, #32CD32 green, #FFA500 orange, #FF69B4 pink, #1E90FF cyan, #9370DB purple) to each HSK 3+ word.
- Apply the EXACT SAME color to the Chinese word, its Pinyin, and its English translation using <span style="color:#HEX">word</span>. Low level words stay #E0E0E0.
- Return ONLY raw HTML inner elements inside a <div> tag without markdown backticks.

Text: [PASTE YOUR CHINESE SENTENCE HERE]</textarea>
  </div>

  <!-- STEP 2: CODE INPUT BOX -->
  <div class="card">
    <label>2. Paste Code Output Here:</label>
    <textarea id="codeInput" placeholder="Paste generated HTML code here..." oninput="renderCode()"></textarea>
  </div>

  <!-- STEP 3: LIVE RENDER OUTPUT -->
  <div class="card">
    <label>3. Rendered Result:</label>
    <div id="previewCard" class="preview-card">
      <span style="color: #555; font-size: 14px;">Colorized text will appear here...</span>
    </div>
  </div>
</div>

<script>
  function copyPromptText() {
    const promptText = document.getElementById('promptTemplate');
    promptText.select();
    navigator.clipboard.writeText(promptText.value);
    alert('Prompt copied!');
  }

  function renderCode() {
    const rawCode = document.getElementById('codeInput').value;
    let cleanedCode = rawCode.replace(/```html/gi, '').replace(/```/g, '').trim();
    
    const previewDiv = document.getElementById('previewCard');
    if (cleanedCode) {
      previewDiv.innerHTML = cleanedCode;
    } else {
      previewDiv.innerHTML = '<span style="color: #555; font-size: 14px;">Colorized text will appear here...</span>';
    }
  }
</script>
</body>
</html>
